# RoleMem Protocol V2 Formal Agent Experiment Configuration
protocol_version: "2.0.0"
benchmark_scope: "TRACK_A_CURATED_V2"
manifest_path: "data/benchmark_v2/track_a_core.jsonl"
controls_manifest_path: "data/benchmark_v2/track_a_controls.jsonl"
validity_benchmark_path: "data/memory_validity_v2/blind_inputs.jsonl"

model_config:
  model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"
  model_path: "/code/rolemem-agent-memory/models/qwen2.5-coder-7b"
  torch_dtype: "float16"
  device_map: "auto"
  temperature: 0.2
  top_p: 0.95
  do_sample: true
  max_new_tokens: 512

token_budget:
  total_context_limit: 2048
  breakdown:
    system_prompt_tokens: 150
    repo_context_tokens: 1200
    memory_tokens_max: 400
    task_prompt_tokens: 200
    generation_headroom_tokens: 98

sampling_config:
  seeds: [42, 123, 999]
  repeated_measures_per_transition: 3
  unit_of_analysis: "transition_cluster"
  statistical_significance:
    bootstrap_samples: 10000
    ci_level: 0.95
    hypothesis_tests:
      - "paired_mcnemar"
      - "wilcoxon_signed_rank"

retriever_config:
  retriever_type: "RepoBM25Retriever"
  k1: 1.5
  b: 0.75
  chunk_lines: 40
  similarity_metric: "cosine_bm25_hybrid"

validity_gate_config:
  symbol_engine: "ASTSymbolExtractorV2"
  semantic_verifier: "RoleMemSemanticVerifierV4"
  selective_abstention_threshold: 0.70
  role_bonus_grid: [0.0, 0.25, 0.5, 1.0]
  default_role_bonus: 0.5

sandbox_config:
  executor: "SecureSandboxExecutor"
  isolation: "Bubblewrap"
  timeout_seconds: 30
  venvs_root: "/code/rolemem-agent-memory/.venvs"

conditions:
  B0:
    name: "NO_MEMORY_BASELINE"
    description: "Prompt + Repo Context only (No Memory injection)"
    memory_source: "NONE"
    validity_filter: "NONE"
    role_filtering: false
    role_bonus: 0.0
    selective_abstention: false

  B1:
    name: "RAW_SEMANTIC_RETRIEVAL"
    description: "Top-k semantic/BM25 similarity memory retrieval without role or validity gating"
    memory_source: "UNFILTERED_STORE"
    validity_filter: "NONE"
    role_filtering: false
    role_bonus: 0.0
    selective_abstention: false

  B3:
    name: "ROLE_FILTERED_NO_VALIDITY"
    description: "RoleMem role-filtered memory without validity gate"
    memory_source: "ROLE_FILTERED_STORE"
    validity_filter: "NONE"
    role_filtering: true
    role_bonus: 0.5
    selective_abstention: false

  B4:
    name: "FILE_LEVEL_VALIDITY_FILTER"
    description: "File-level git hash diff validity filter"
    memory_source: "ROLE_FILTERED_STORE"
    validity_filter: "FILE_LEVEL"
    role_filtering: true
    role_bonus: 0.5
    selective_abstention: false

  F:
    name: "FULL_SYMBOL_VALIDITY_NO_ROLE_BONUS"
    description: "RoleMem symbol-level validity filter without role bonus (lambda_role = 0.0)"
    memory_source: "UNFILTERED_STORE"
    validity_filter: "SYMBOL_HYBRID"
    role_filtering: false
    role_bonus: 0.0
    selective_abstention: false

  A2:
    name: "ROLEMEM_FULL_DEFAULT"
    description: "RoleMem full framework (Symbol validity filter + default role bonus lambda_role = 0.5)"
    memory_source: "ROLE_FILTERED_STORE"
    validity_filter: "SYMBOL_HYBRID"
    role_filtering: true
    role_bonus: 0.5
    selective_abstention: false

  A3:
    name: "ROLEMEM_FULL_SELECTIVE_ABSTENTION"
    description: "RoleMem full framework with selective abstention on ambiguous symbol transitions"
    memory_source: "ROLE_FILTERED_STORE"
    validity_filter: "SYMBOL_HYBRID"
    role_filtering: true
    role_bonus: 0.5
    selective_abstention: true

evaluation_policy:
  task_success: "pytest_pass and (not stale_action) and solution_constraint_pass"
  stale_action_detector: "ASTStaleActionDetectorV2"
  solution_constraint_evaluator: "SolutionConstraintEvaluatorV2"
